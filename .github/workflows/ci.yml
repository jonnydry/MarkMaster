name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/markmaster
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/markmaster
  AUTH_SECRET: test-auth-secret
  AUTH_TWITTER_ID: test-twitter-id
  AUTH_TWITTER_SECRET: test-twitter-secret
  NEXTAUTH_URL: http://localhost:3000
  ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Dependency audit
        run: npm audit --audit-level=high

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test:coverage

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
